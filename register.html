<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ALBus - Create Passenger Account</title>
    <link rel="stylesheet" href="/css/albus.css"/>
    <style>
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--tundra);padding:24px;}
        .auth-card{width:420px;max-width:100%;background:#fff;border:1px solid var(--border);border-radius:14px;padding:34px;box-shadow:0 18px 50px rgba(46,58,66,.16);}
        .auth-sub{font-size:13px;color:var(--slate-mid);margin:8px 0 24px;}
        .auth-links{margin-top:16px;text-align:center;font-size:13px;color:var(--slate-mid);}
        .auth-links a{color:var(--red);font-weight:600;}
    </style>
</head>
<body>
<main class="auth-card">
    <div class="wm wm-lg"><span class="wm-al">AL</span><span class="wm-bus">Bus</span></div>
    <p class="auth-sub">Create a passenger account</p>

    <div class="form-group">
        <label class="form-label" for="fullName">Full name</label>
        <input class="form-control" id="fullName" autocomplete="name" placeholder="Your name"/>
    </div>
    <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" autocomplete="email" placeholder="you@albus.al"/>
    </div>
    <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters"/>
    </div>

    <div class="alert alert-error" id="errBox"></div>
    <div class="alert alert-success" id="okBox"></div>
    <button class="btn btn-primary btn-lg btn-block" id="registerBtn">Create Account</button>

    <div class="auth-links">Already have an account? <a href="/index.html">Sign in</a></div>
</main>

<script src="/js/api.js"></script>
<script>
    const fullName = document.getElementById('fullName');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const errBox = document.getElementById('errBox');
    const okBox = document.getElementById('okBox');
    const registerBtn = document.getElementById('registerBtn');

    function show(el, msg){ el.textContent = msg; el.classList.add('show'); }
    function hide(el){ el.textContent = ''; el.classList.remove('show'); }

    registerBtn.addEventListener('click', async () => {
        hide(errBox); hide(okBox);
        const name = fullName.value.trim();
        const mail = email.value.trim();
        const pwd = password.value;
        if (!name) return show(errBox, 'Full name is required.');
        if (!mail || !mail.includes('@')) return show(errBox, 'A valid email is required.');
        if (pwd.length < 6) return show(errBox, 'Password must be at least 6 characters.');

        registerBtn.disabled = true;
        registerBtn.textContent = 'Creating...';
        try {
            await API.registerPassenger(name, mail, pwd);
            show(okBox, 'Passenger account created. You can sign in now.');
            setTimeout(() => window.location.href = '/index.html', 900);
        } catch (e) {
            show(errBox, e.message || 'Could not create account.');
        } finally {
            registerBtn.disabled = false;
            registerBtn.textContent = 'Create Account';
        }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Enter') registerBtn.click(); });
</script>
</body>
</html>
